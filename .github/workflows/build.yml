name: Versions portables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fichiers uniques (HTML + Python)
        run: python build.py
      - name: Exécutable (PyInstaller, yt-dlp inclus)
        run: |
          pip install pyinstaller yt-dlp
          pyinstaller --onefile --name DashGallery --distpath dist/bin dist/dashgallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: DashGallery-${{ runner.os }}
          path: |
            dist/DashGallery.html
            dist/dashgallery.py
            dist/bin/*
      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bin/*
            dist/DashGallery.html
            dist/dashgallery.py
